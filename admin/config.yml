backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "pt"

collections:
  - name: "products"
    label: "Produtos (Boxfy Store)"
    label_singular: "Lista de produtos"
    files:
      - name: "products"
        label: "Produtos"
        file: "data/products.json"
        fields:
          - label: "Produtos"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — Kz {{fields.price}}"
            fields:
              - {label: "Nome do produto", name: "name", widget: "string"}
              - label: "Categoria"
                name: "category"
                widget: "select"
                options: ["Ténis", "Roupa", "Acessório", "Outro"]
              - {label: "Descrição", name: "description", widget: "text", required: false}
              - {label: "Preço (em Kz, só números)", name: "price", widget: "string"}
              - {label: "Foto do produto", name: "image", widget: "image", required: false}
